name: Release

# Tag-driven, no release PR: this is a solo repo that works directly on main.
#   make release VERSION=0.4.0   ->   bumps, tags, pushes   ->   this runs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Tarball + GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      - name: Build tarball and checksums
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          staging="claude-sandbox-${TAG}"
          mkdir -p "dist/${staging}"
          cp -R claude-sandbox install.sh Dockerfile .dockerignore Makefile \
                runtime completions tests LICENSE README.md CHANGELOG.md "dist/${staging}/"
          tar -czf "dist/claude-sandbox-${TAG}.tar.gz" -C dist "${staging}"
          (cd dist && sha256sum "claude-sandbox-${TAG}.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Release notes from conventional commits
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          range="${prev:+$prev..}${TAG}"
          {
            echo "## What's changed"
            echo ""
            for type in feat fix perf refactor docs; do
              case "$type" in
                feat) title="Features" ;; fix) title="Bug Fixes" ;;
                perf) title="Performance" ;; refactor) title="Refactoring" ;;
                *) title="Documentation" ;;
              esac
              body=$(git log "$range" --pretty=format:'%s' | sed -n "s/^${type}: /- /p")
              [ -n "$body" ] && { echo "### $title"; echo ""; echo "$body"; echo ""; }
            done
            echo "### Install"
            echo ''
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash"
            echo '```'
          } > NOTES.md
          cat NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file NOTES.md \
            "dist/claude-sandbox-${TAG}.tar.gz" \
            dist/SHA256SUMS \
            || gh release upload "$TAG" \
                 "dist/claude-sandbox-${TAG}.tar.gz" dist/SHA256SUMS --clobber

  image:
    name: Multi-arch image to GHCR
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
